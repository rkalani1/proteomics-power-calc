name: CI

# Runs lint, the statistics/render test suite, and the production build on pull
# requests and on pushes to any non-main branch. Pushes to main are already
# covered by deploy.yml (which lints, tests, and builds before deploying), so
# main is excluded here to avoid duplicate runs.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
